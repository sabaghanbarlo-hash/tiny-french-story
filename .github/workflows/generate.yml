name: Generate lesson video
run-name: Lesson ${{ inputs.story }}

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Script file in the repo, e.g. lessons/web/202610241200-my-lesson.txt"
        required: true
      post:
        description: "Post to Instagram right after rendering? (true/false)"
        default: "false"
      format:
        description: "small = two friends chatting at a table | story = animated story"
        default: "story"

permissions:
  contents: read

concurrency:
  group: tiny-french-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      STORY: ${{ inputs.story }}
      FORMAT: ${{ inputs.format }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          [[ "$STORY" =~ ^lessons/[A-Za-z0-9._/-]+\.txt$ ]] && [[ "$STORY" != *..* ]] || { echo "::error::Bad script path"; exit 1; }
          case "$FORMAT" in small|story) ;; *) echo "::error::Bad format"; exit 1;; esac
          [ -f "$STORY" ] || { echo "::error::Script file not found: $STORY"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Check the script
        run: |
          if [ "$FORMAT" = "small" ]; then python small.py --check "$STORY"; else python validate_script.py "$STORY"; fi
      - name: Prepare character art from the reference picture (if it is in the repo)
        if: inputs.format == 'small'
        run: |
          if ls assets/reference/*.png assets/reference/*.jpg assets/reference/*.jpeg >/dev/null 2>&1 && [ ! -f assets/sprites/meta.json ]; then
            pip install opencv-python-headless
            python extract_sprites.py
          fi
      - name: Install FFmpeg and fonts
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -y -o Acquire::Retries=3 || true
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation || true
          ffmpeg -version | head -1
      - name: Render video
        run: |
          mkdir -p site/videos
          if [ "$FORMAT" = "small" ]; then python small.py "$STORY" -o site/videos; else python lesson.py "$STORY" -o site/videos; fi
          rm -rf site/videos/.tmp
          export STEM="$(basename "${STORY%.txt}")"
          CAP="${STORY%.txt}.caption"
          if [ -s "$CAP" ]; then cp "$CAP" "site/videos/$STEM.caption.txt"; fi
          python - <<'PY'
          import os
          from PIL import Image
          s = os.environ["STEM"]
          Image.open(f"site/videos/{s}.cover.png").convert("RGB").save(f"site/videos/{s}.jpg", quality=92)
          PY
          ls -la site/videos
          { echo "### $STEM"; echo; echo '```'; cat "site/videos/$STEM.caption.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare site (studio page)
        run: cp studio/index.html site/index.html
      - name: Keep all files as a download
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: site/videos
          retention-days: 14
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    needs: deploy
    if: inputs.post == 'true'
    runs-on: ubuntu-latest
    env:
      STORY: ${{ inputs.story }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: videos
          path: out
      - name: Publish Reel to Instagram
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          IG_ACCOUNT: ${{ vars.IG_ACCOUNT }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          STEM="$(basename "${STORY%.txt}")"
          if [ -z "$COMPOSIO_API_KEY" ]; then echo "::error::Add the COMPOSIO_API_KEY repository secret to enable Instagram posting."; exit 1; fi
          python -u publish.py "out/$STEM.caption.txt" "$STEM" | tee publish.log
          grep -q "^PUBLISHED on Instagram" publish.log
