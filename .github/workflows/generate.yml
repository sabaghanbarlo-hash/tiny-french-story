name: Generate lesson video
run-name: Lesson ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job id (8-32 hex characters, made by the studio page)"
        required: true
      script:
        description: "The lesson script text"
        required: true
      mode:
        description: "check = validate only | render = make the video | post = make the video and post it to Instagram"
        default: "render"

permissions:
  contents: read

concurrency:
  group: tiny-french-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB: ${{ inputs.job }}
      MODE: ${{ inputs.mode }}
      SCRIPT: ${{ inputs.script }}
    steps:
      - uses: actions/checkout@v4
      - name: Check inputs
        run: |
          [[ "$JOB" =~ ^[a-f0-9]{8,32}$ ]] || { echo "::error::Bad job id"; exit 1; }
          case "$MODE" in check|render|post) ;; *) echo "::error::Bad mode"; exit 1;; esac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Save the script
        run: printf '%s\n' "$SCRIPT" > "lesson-$JOB.txt"
      - name: Check the script
        run: python validate_script.py "lesson-$JOB.txt"
      - name: Install FFmpeg and fonts
        if: inputs.mode != 'check'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -y -o Acquire::Retries=3 || true
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-liberation || true
          ffmpeg -version | head -1
      - name: Render video
        if: inputs.mode != 'check'
        run: |
          mkdir -p site/videos
          python lesson.py "lesson-$JOB.txt" -o site/videos
          rm -rf site/videos/.tmp
          python - <<'PY'
          import os
          from PIL import Image
          j = os.environ["JOB"]
          Image.open(f"site/videos/lesson-{j}.cover.png").convert("RGB").save(f"site/videos/lesson-{j}.jpg", quality=92)
          PY
          ls -la site/videos
          { echo "### Lesson $JOB"; echo; echo '```'; cat "site/videos/lesson-$JOB.caption.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare site
        if: inputs.mode != 'check'
        run: echo '<!doctype html><meta charset="utf-8"><title>Tiny French videos</title><p>Tiny French videos.' > site/index.html
      - name: Keep all files as a download
        if: inputs.mode != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: lesson-${{ inputs.job }}
          path: site/videos
          retention-days: 14
      - name: Upload site
        if: inputs.mode != 'check'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: render
    if: inputs.mode != 'check'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  instagram:
    needs: deploy
    if: inputs.mode == 'post'
    runs-on: ubuntu-latest
    env:
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lesson-${{ inputs.job }}
          path: out
      - name: Publish Reel to Instagram
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          IG_ACCOUNT: ${{ vars.IG_ACCOUNT }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ -z "$COMPOSIO_API_KEY" ]; then echo "::error::Add the COMPOSIO_API_KEY repository secret to enable Instagram posting."; exit 1; fi
          python -u publish.py "out/lesson-$JOB.caption.txt" "lesson-$JOB" | tee publish.log
          grep -q "^PUBLISHED on Instagram" publish.log
