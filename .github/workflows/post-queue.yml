name: Post queued Reels
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiny-french-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Post what is due
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          IG_ACCOUNT: ${{ vars.IG_ACCOUNT }}
          IG_EXPECT_USERNAME: ${{ vars.IG_EXPECT_USERNAME }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          DUE="$(python queue_tool.py due)"
          if [ -z "$DUE" ]; then echo "Nothing is due."; exit 0; fi
          if [ -z "$COMPOSIO_API_KEY" ]; then echo "::error::The COMPOSIO_API_KEY secret is missing."; exit 1; fi
          for STEM in $DUE; do
            echo "== Posting $STEM"
            python -u publish.py "queue/videos/$STEM.caption.txt" "$STEM" 2>&1 | tee "/tmp/p-$STEM.log" || true
            if grep -q "^PUBLISHED on Instagram" "/tmp/p-$STEM.log"; then
              MID="$(sed -n 's/^PUBLISHED on Instagram, media id: //p' "/tmp/p-$STEM.log" | head -1)"
              python queue_tool.py done --stem "$STEM" --media-id "$MID"
            else
              python queue_tool.py fail --stem "$STEM"
            fi
          done
      - name: Save the queue changes
        run: |
          git config user.name "tiny-french-bot"; git config user.email "tiny-french-bot@users.noreply.github.com"
          git add -A queue
          git commit -m "Queue update" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
