name: Update studio pages
run-name: Update studio pages

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "sprites.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiny-french-render
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install sprite renderer dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Prepare site (studio pages and queued videos)
        run: |
          mkdir -p site/videos site/characters
          cp -R studio/characters/. site/characters/
          python - <<'PY'
          from pathlib import Path
          from sprites import sprite
          out = Path("site/characters")
          names = ("Adrien", "Marinette", "Camille", "Th\u00e9o", "Chlo\u00e9", "Lucas", "Félix", "Zoé")
          filenames = {"Th\u00e9o": "theo.png", "Chlo\u00e9": "chloe.png", "Félix": "felix.png", "Zoé": "zoe.png"}
          for name in names:
              filename = filenames.get(name, name.lower() + ".png")
              sprite(name, 0, False).save(out / filename)
          PY
          cp studio/index.html site/index.html
          cp studio/queue.html site/queue.html
          cp -n queue/videos/* site/videos/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
